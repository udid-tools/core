name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      dist-tag: ${{ steps.package.outputs.dist-tag }}
      tarball: ${{ steps.package.outputs.tarball }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete verification
        run: npm run verify

      - name: Validate tag and create one release tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${version}." >&2
            exit 1
          fi

          dist_tag="latest"
          if [[ "${version}" == *-* ]]; then
            if [[ "${version}" != *-beta.* ]]; then
              echo "Only beta prereleases are supported by the prerelease pipeline." >&2
              exit 1
            fi
            dist_tag="beta"
          fi

          mkdir release
          tarball="$(npm pack --silent --pack-destination release)"
          unexpected="$(tar --list --gzip --file "release/${tarball}" | grep --extended-regexp --invert-match '^package/(dist(/.*)?|package.json|README.md|LICENSE|SECURITY.md)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Packed artifact contains files outside the release allow-list:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          (
            cd release
            sha256sum "${tarball}" > "${tarball}.sha256"
          )
          npm sbom --omit=dev --sbom-format cyclonedx --sbom-type library > "release/${tarball}.sbom.cdx.json"

          echo "dist-tag=${dist_tag}" >> "${GITHUB_OUTPUT}"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test the exact tarball
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          consumer_dir="${RUNNER_TEMP}/consumer"
          mkdir "${consumer_dir}"
          cd "${consumer_dir}"
          npm init --yes
          npm pkg set type=module
          npm install --ignore-scripts --no-audit --no-fund "${GITHUB_WORKSPACE}/release/${TARBALL}"
          node --input-type=module --eval "const api = await import('@udid-tools/core'); if (typeof api.generateProfile !== 'function' || typeof api.parseProfileServiceResponse !== 'function') process.exit(1);"

      - name: Attest release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/${{ steps.package.outputs.tarball }}

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish to npm
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global --ignore-scripts npm@11.19.0

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Verify tarball checksum
        shell: bash
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check "${TARBALL}.sha256"

      - name: Publish exact tarball with provenance
        shell: bash
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          package_path="release/${TARBALL}"
          local_integrity="$(node --eval "const fs = require('node:fs'); const crypto = require('node:crypto'); process.stdout.write('sha512-' + crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'));" "${package_path}")"
          remote_integrity="$(npm view "@udid-tools/core@${VERSION}" dist.integrity 2>/dev/null || true)"

          if [[ -n "${remote_integrity}" ]]; then
            if [[ "${remote_integrity}" != "${local_integrity}" ]]; then
              echo "npm already contains ${VERSION}, but its integrity does not match this release tarball." >&2
              exit 1
            fi
            echo "npm already contains the checksum-matching ${VERSION}; skipping republish."
            exit 0
          fi

          npm publish "${package_path}" --access public --ignore-scripts --provenance --tag "${DIST_TAG}"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@udid-tools"

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Verify tarball checksum
        shell: bash
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check "${TARBALL}.sha256"

      - name: Publish the same tarball to GitHub Packages
        shell: bash
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          package_path="release/${TARBALL}"
          registry="https://npm.pkg.github.com"
          local_integrity="$(node --eval "const fs = require('node:fs'); const crypto = require('node:crypto'); process.stdout.write('sha512-' + crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'));" "${package_path}")"
          remote_integrity="$(npm view "@udid-tools/core@${VERSION}" dist.integrity --registry "${registry}" 2>/dev/null || true)"

          if [[ -n "${remote_integrity}" ]]; then
            if [[ "${remote_integrity}" != "${local_integrity}" ]]; then
              echo "GitHub Packages already contains ${VERSION}, but its integrity does not match this release tarball." >&2
              exit 1
            fi
            echo "GitHub Packages already contains the checksum-matching ${VERSION}; skipping republish."
            exit 0
          fi

          npm publish "${package_path}" --registry "${registry}" --ignore-scripts --provenance=false --tag "${DIST_TAG}"

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish-npm
      - publish-github-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Verify tarball checksum
        shell: bash
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check "${TARBALL}.sha256"

      - name: Create release with checksum and SBOM
        shell: bash
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            "${GITHUB_REF_NAME}"
            --verify-tag
            --generate-notes
            --title "${GITHUB_REF_NAME}"
          )
          if [[ "${DIST_TAG}" == "beta" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" release/*
